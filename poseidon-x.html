<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poseidon X — Track. Detect. Protect.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --navy:#0b2545; --navy-deep:#0b2b52; --navy-deep2:#123a6b;
    --teal:#0aa88f; --teal-dark:#0c9c85;
    --blue:#1c6dd0; --blue-bg:#e8f4ff;
    --ink-soft:#5a6b80; --ink-faint:#8695a8;
    --bg:#f5f8fb; --line: rgba(0,0,0,.06);
    --good:#12b886; --fair:#f2b134; --poor:#e6553a;
    --high-bg:#fdeceb; --high-fg:#c0392b;
    --med-bg:#fff6e0; --med-fg:#a97a0a;
    --low-bg:#e7f8f1; --low-fg:#0e8f63;
    --card-bg:#fff; --surface:#fff;
  }
  [data-theme="dark"]{
    --bg:#081524; --card-bg:#0f2038; --surface:#0f2038; --line: rgba(255,255,255,.09);
    --navy:#eef3fa; --ink-soft:#a9b8cc; --ink-faint:#7c8ba0;
    --blue-bg:#123252;
    --high-bg:#3a1a1a; --med-bg:#3a2f10; --low-bg:#123326;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--navy); antialiased:true;
    -webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  .max{max-width:1152px;margin:0 auto;padding:0 20px;}
  img,svg{display:block;}

  /* ---------- NAV ---------- */
  .nav{position:sticky;top:0;z-index:30;background:var(--navy-deep);border-bottom:1px solid rgba(255,255,255,.1);}
  .nav-inner{max-width:1152px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;}
  .logo-badge{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1c6dd0,#0aa88f);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-text{font-weight:800;font-size:18px;letter-spacing:-0.02em;color:#fff;}
  .logo-text span{color:var(--teal);}
  .nav-links{display:flex;align-items:center;gap:4px;}
  .nav-link{padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8);background:none;border:none;transition:.15s;}
  .nav-link:hover{color:#fff;background:rgba(255,255,255,.1);}
  .nav-link.active{background:#fff;color:var(--navy);}
  .nav-toggle{display:none;background:none;border:none;color:#fff;}
  .nav-mobile{display:none;flex-direction:column;gap:4px;padding:0 20px 16px;background:var(--navy-deep);}
  .nav-mobile .nav-link{text-align:left;padding:10px 12px;}
  @media (max-width:820px){
    .nav-links{display:none;}
    .nav-toggle{display:block;}
    .nav-mobile.open{display:flex;}
  }

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--navy-deep),var(--navy-deep2));color:#fff;}
  .hero::before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none;
    background:radial-gradient(circle at 20% 30%, #fff 0, transparent 45%),radial-gradient(circle at 80% 70%, #0aa88f 0, transparent 45%);}
  .hero-inner{position:relative;max-width:1152px;margin:0 auto;padding:80px 20px 96px;}
  .pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);padding:7px 14px;border-radius:999px;margin-bottom:24px;}
  .pill svg{color:#5be0c5;}
  .hero h1{font-size:44px;line-height:1.08;font-weight:800;max-width:640px;margin:0;letter-spacing:-0.02em;}
  .hero p{margin-top:20px;color:rgba(255,255,255,.7);max-width:560px;font-size:16px;line-height:1.6;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}
  .btn{padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;border:none;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}
  .btn-dark{background:var(--navy);color:#fff;}

  /* ---------- FEATURE CARDS ---------- */
  .features{max-width:1152px;margin:-42px auto 0;padding:0 20px 24px;position:relative;}
  .feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  @media (max-width:900px){.feature-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.feature-grid{grid-template-columns:1fr;}}
  .card{background:var(--card-bg);border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 30px -12px rgba(11,43,82,.25);padding:24px;}
  .card-module{cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .card-module:hover{transform:translateY(-3px);box-shadow:0 16px 36px -12px rgba(11,43,82,.35);}
  .card-module:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .feature-icon{width:44px;height:44px;border-radius:12px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .feature-icon svg{color:var(--blue);}
  .card h3{font-size:16px;font-weight:700;margin:0;line-height:1.3;}
  .card p{font-size:13.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.55;}

  /* ---------- STATS ---------- */
  .stats{max-width:1152px;margin:0 auto;padding:64px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px;}
  @media (max-width:700px){.stats{grid-template-columns:1fr;text-align:center;}}
  .stat-num{font-size:36px;font-weight:800;}
  .stat-label{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- PAGE HEADER ---------- */
  .page{max-width:1152px;margin:0 auto;padding:40px 20px;}
  .page-narrow{max-width:896px;}
  .page-xnarrow{max-width:672px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
  .page h1{font-size:26px;font-weight:800;margin:0;}
  .page-sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
  .title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}

  /* ---------- DASHBOARD ---------- */
  .stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
  @media (max-width:700px){.stat-cards{grid-template-columns:1fr;}}
  .stat-card{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);padding:20px;}
  .stat-card .label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .stat-card .value{font-size:24px;font-weight:800;margin-top:4px;}
  .stat-card .sub{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

  .dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start;}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .panel{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:15px;font-weight:800;margin:0;}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

  .map-toggle{display:flex;gap:3px;background:#eef2f6;padding:3px;border-radius:999px;}
  .map-toggle-btn{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink-soft);transition:.15s;}
  .map-toggle-btn.active{background:var(--card-bg);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .legend-group{display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
  .legend-title{font-size:9.5px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}
  .map-wrap{position:relative;height:460px;background:#dcedf7;isolation:isolate;z-index:0;}
  #leafletMap{position:absolute;inset:0;width:100%;height:100%;}
  /* Leaflet's internal panes/controls use z-indexes up to 1000; keep them isolated to this
     container (via isolation:isolate above) so they can never render above the sticky nav
     or other panels once this section scrolls under them. */
  .map-wrap .leaflet-pane{z-index:auto;}
  .map-wrap .leaflet-top,.map-wrap .leaflet-bottom{z-index:2;}
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .leaflet-popup-content{margin:12px 14px;font-family:'Manrope',sans-serif;}
  .lp-code{font-size:11px;color:var(--ink-soft);font-family:ui-monospace,monospace;}
  .lp-name{font-weight:800;font-size:13.5px;margin-top:2px;color:var(--navy);}
  .lp-score-row{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-soft);gap:16px;}
  .lp-score-val{font-weight:800;font-size:15px;}
  .lp-state{font-weight:800;font-size:13px;color:var(--navy);}
  .lp-state-status{font-size:11.5px;margin-top:4px;font-weight:700;}

  .alerts-list{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:420px;overflow-y:auto;}
  .alert{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px;transition:.15s;}
  .alert:hover{border-color:rgba(0,0,0,.12);}
  .alert-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .alert-title{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;}
  .alert-title svg{flex-shrink:0;}
  .alert-HIGH{border-left-color:var(--high-fg);background:linear-gradient(90deg,var(--high-bg),var(--card-bg) 22%);}
  .alert-HIGH .alert-title svg{color:var(--high-fg);}
  .alert-MEDIUM{border-left-color:var(--med-fg);background:linear-gradient(90deg,var(--med-bg),var(--card-bg) 22%);}
  .alert-MEDIUM .alert-title svg{color:var(--med-fg);}
  .alert-LOW{border-left-color:var(--low-fg);background:linear-gradient(90deg,var(--low-bg),var(--card-bg) 22%);}
  .alert-LOW .alert-title svg{color:var(--low-fg);}
  .badge{font-size:11px;font-weight:800;letter-spacing:.02em;padding:4px 9px;border-radius:999px;white-space:nowrap;}
  .badge-HIGH{background:var(--high-bg);color:var(--high-fg);}
  .badge-MEDIUM{background:var(--med-bg);color:var(--med-fg);}
  .badge-LOW{background:var(--low-bg);color:var(--low-fg);}
  .alert-body{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .alert-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--ink-faint);}
  .alert-meta .loc{display:flex;align-items:center;gap:4px;}

  /* ---------- LEADERBOARD ---------- */
  .lb-list{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .lb-row{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;background:#eef2f6;color:var(--ink-soft);}
  .lb-rank.top{background:#fff3d6;color:#a97a0a;}
  .lb-name{font-weight:700;font-size:14.5px;}
  .lb-region{font-size:12px;color:var(--ink-faint);display:flex;align-items:center;gap:4px;margin-top:2px;}
  .lb-points{text-align:right;font-weight:800;color:var(--teal);font-size:15px;}
  .lb-points-label{font-size:11px;color:var(--ink-faint);}
  .lb-flex{flex:1;min-width:0;}

  /* ---------- LEARN ---------- */
  .learn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  @media (max-width:700px){.learn-grid{grid-template-columns:1fr;}}
  .learn-card{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .learn-card-art{height:110px;}
  .learn-card > .learn-tag,.learn-card > h3,.learn-card > p,.learn-card > .learn-foot{padding-left:24px;padding-right:24px;}
  .learn-tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--blue);background:var(--blue-bg);padding:5px 11px;border-radius:999px;margin-top:16px;}
  .learn-card h3{font-size:16px;font-weight:800;margin:12px 0 0;}
  .learn-card p{font-size:13.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.55;flex:1;}
  .learn-foot{display:flex;justify-content:space-between;margin-top:16px;margin-bottom:20px;font-size:12.5px;align-items:center;}
  .learn-read{color:var(--ink-faint);}
  .learn-cta{background:none;border:none;font:inherit;display:flex;align-items:center;gap:4px;padding:0;font-weight:700;color:var(--teal);cursor:pointer;}
  .learn-modal-backdrop{position:fixed;inset:0;background:rgba(8,18,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .learn-modal{background:var(--card-bg);color:var(--navy);border-radius:18px;max-width:640px;width:100%;max-height:min(85vh,780px);overflow-y:auto;box-shadow:0 30px 60px -15px rgba(0,0,0,.45);}
  .learn-modal-art{height:170px;}
  .learn-modal-inner{padding:24px 28px 32px;}
  .learn-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .learn-modal-close{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;flex-shrink:0;}
  .learn-modal h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-0.01em;}
  .learn-modal-meta{font-size:12.5px;color:var(--ink-faint);margin-bottom:18px;}
  .learn-modal-body h4{font-size:13px;font-weight:800;color:var(--teal-dark);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px;}
  .learn-modal-body h4:first-child{margin-top:0;}
  .learn-modal-body p{font-size:14.5px;line-height:1.75;color:var(--ink-soft);margin:0 0 4px;}
  .learn-modal-body ul{margin:0 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px;}
  .learn-modal-body li{font-size:14px;line-height:1.6;color:var(--ink-soft);}

  /* ---------- REPORT FORM ---------- */
  .report-head{text-align:center;margin-bottom:32px;}
  .report-head h1{font-size:30px;font-weight:800;margin:0;}
  .report-head .kicker{color:var(--teal);font-weight:800;font-size:13px;letter-spacing:.04em;margin-top:6px;}
  .report-head p{font-size:14px;color:var(--ink-soft);max-width:420px;margin:12px auto 0;}
  .form-card{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:26px;}
  .form-section h2{font-size:14px;font-weight:800;margin:0 0 12px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field input,.field textarea{width:100%;margin-top:6px;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,168,143,.15);}
  .field textarea{resize:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}
  .sev-row{display:flex;gap:8px;margin-top:6px;}
  .sev-btn{flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;border:1px solid rgba(0,0,0,.12);background:var(--card-bg);color:var(--ink-soft);}
  .sev-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .form-card > * + *{margin-top:20px;}
  .submit-btn{width:100%;padding:14px 0;border-radius:999px;background:var(--teal);color:#fff;font-weight:800;font-size:14px;border:none;display:flex;align-items:center;justify-content:center;gap:8px;}
  .submit-btn:hover{background:var(--teal-dark);}
  .success{text-align:center;padding:96px 20px;}
  .success-icon{width:56px;height:56px;border-radius:50%;background:var(--low-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .success-icon svg{color:var(--low-fg);}
  .success h1{font-size:26px;font-weight:800;margin:0;}
  .success p{font-size:14px;color:var(--ink-soft);margin-top:8px;}

  /* ---------- FOOTER ---------- */
  footer{background:var(--navy-deep);color:rgba(255,255,255,.6);font-size:13px;margin-top:64px;}
  .footer-inner{max-width:1152px;margin:0 auto;padding:32px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  [hidden]{display:none !important;}

  /* ---------- NAV ICON BUTTONS + NOTIFICATIONS ---------- */
  .nav-icons{display:flex;align-items:center;gap:6px;}
  .nav-icon-btn{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .nav-icon-btn:hover{background:rgba(255,255,255,.2);}
  .nav-icon-btn .dot-badge{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--high-fg);border:2px solid var(--navy-deep);}
  .notif-pop{position:absolute;top:52px;right:20px;width:320px;background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.35);z-index:50;overflow:hidden;}
  .notif-pop-head{padding:14px 16px;font-weight:800;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .notif-pop-head span{font-size:11px;font-weight:700;color:var(--teal);}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item .t{font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;}
  .notif-item .b{color:var(--ink-soft);margin-top:3px;line-height:1.4;}
  .notif-item .m{color:var(--ink-faint);font-size:11px;margin-top:5px;}
  .notif-foot{padding:10px;text-align:center;}
  .notif-foot button{background:none;border:none;color:var(--teal);font-weight:700;font-size:12.5px;}

  /* ---------- AQUABOT WIDGET ---------- */
  .bot-fab{position:fixed;bottom:22px;right:22px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));border:none;box-shadow:0 12px 28px -6px rgba(11,43,82,.45);z-index:60;display:flex;align-items:center;justify-content:center;color:#fff;}
  .bot-fab:hover{transform:translateY(-2px);}
  .bot-panel{position:fixed;bottom:92px;right:22px;width:320px;max-width:calc(100vw - 32px);height:420px;background:var(--card-bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 48px -12px rgba(0,0,0,.4);z-index:60;display:flex;flex-direction:column;overflow:hidden;}
  .bot-head{background:linear-gradient(135deg,var(--navy-deep),var(--navy-deep2));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .bot-head-name{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;}
  .bot-status{width:8px;height:8px;border-radius:50%;background:#5be0c5;}
  .bot-close{background:none;border:none;color:rgba(255,255,255,.7);}
  .bot-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .bot-msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:12.8px;line-height:1.45;}
  .bot-msg.bot{background:var(--blue-bg);color:var(--navy);border-bottom-left-radius:4px;align-self:flex-start;}
  .bot-msg.user{background:var(--teal);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
  .bot-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
  .bot-chip{font-size:11px;font-weight:700;background:var(--blue-bg);color:var(--blue);border:none;padding:6px 10px;border-radius:999px;}

  {title:"What is turbidity, really?", tag:"Basics", read:"6 min", art:"turbidity", body:"How suspended particles scatter light, and why cloudy water is an early-warning signal.",
    full:[
      {h:"The basic idea", p:"Turbidity is simply a measure of how cloudy or hazy water looks, caused by large numbers of tiny particles that are usually invisible individually — silt, clay, algae, organic matter, and industrial or urban runoff. Instruments measure it by shining a light through a water sample and recording how much of that light scatters off the suspended particles rather than passing straight through, reported in units called NTU (nephelometric turbidity units)."},

/* ---------- SYNTHETIC HISTORY + FORECAST (deterministic pseudo-random) ---------- */
function seeded(seed){ let s = seed % 2147483647; if(s<=0) s+=2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; }; }

function stationHistory(station){
  const rnd = seeded(station.code.split("").reduce((a,c)=>a+c.charCodeAt(0),0) + station.score);
  const days = 14;
  let val = station.score + (rnd()*10-5);
  const hist = [];
  for(let i=days;i>0;i--){
    val += (rnd()*10-5);
    val = Math.max(8, Math.min(97, val));
    hist.push(Math.round(val));
  }
  hist[hist.length-1] = station.score;
  // simple linear trend from last 6 points -> 3-day forecast
  const tail = hist.slice(-6);
  const n = tail.length;
  const xs = tail.map((_,i)=>i);
  const xbar = xs.reduce((a,b)=>a+b,0)/n, ybar = tail.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-xbar)*(tail[i]-ybar); den += (xs[i]-xbar)**2; }
  const slope = den===0 ? 0 : num/den;
  const forecast = [];
  let last = hist[hist.length-1];
  for(let i=1;i<=3;i++){ last = Math.max(5, Math.min(99, last + slope)); forecast.push(Math.round(last)); }
  return {hist, forecast, slope};
}

/* ---------- Lightweight inline-SVG line chart (no external chart library needed) ---------- */
function buildLineChartSVG(seriesList, opts={}){
  const width = opts.width || 600, height = opts.height || 220;
  const padL = 10, padR = 10, padT = 16, padB = 16;
  const min = opts.min!==undefined ? opts.min : 0, max = opts.max!==undefined ? opts.max : 100;
  const n = Math.max(...seriesList.map(s=>s.data.length));
  const xAt = i => padL + (n<=1 ? 0 : i*(width-padL-padR)/(n-1));
  const yAt = v => (height-padB) - ((v-min)/(max-min))*(height-padT-padB);
  const gridLines = [0,25,50,75,100].map(g=>`<line x1="${padL}" x2="${width-padR}" y1="${yAt(g).toFixed(1)}" y2="${yAt(g).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join("");
  const body = seriesList.map(s=>{
    const pts = s.data.map((v,i)=>[xAt(i), yAt(v)]);
    const dashFrom = s.dashFrom!==undefined ? s.dashFrom : pts.length-1;
    const solidPts = pts.slice(0, dashFrom+1);
    const dashPts = pts.slice(dashFrom);
    const toPath = arr => arr.length ? "M"+arr.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" L") : "";
    let fillEl = "";
    if(s.fill && solidPts.length>1){
      const base = (height-padB).toFixed(1);
      fillEl = `<path d="${toPath(solidPts)} L${solidPts[solidPts.length-1][0].toFixed(1)},${base} L${solidPts[0][0].toFixed(1)},${base} Z" fill="${s.color}" fill-opacity="0.12" stroke="none"/>`;
    }
    const solidEl = solidPts.length>1 ? `<path d="${toPath(solidPts)}" fill="none" stroke="${s.color}" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>` : "";
    const dashEl = dashPts.length>1 ? `<path d="${toPath(dashPts)}" fill="none" stroke="${s.color}" stroke-width="2.75" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>` : "";
    const lastPt = pts[pts.length-1];
    const dotEl = `<circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
    return fillEl + solidEl + dashEl + dotEl;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:100%;display:block;">${gridLines}${body}</svg>`;
}

function trendChartSVG(station){
  const {hist, forecast} = stationHistory(station);
  return buildLineChartSVG([
    { data:[...hist, ...forecast], color:STATUS_COLOR[station.status], dashFrom:hist.length-1, fill:true }
  ], {height:220});
}

function compareChartSVG(a,b){
  const ha = stationHistory(a), hb = stationHistory(b);
  const chart = buildLineChartSVG([
    { data:[...ha.hist, ...ha.forecast], color:"#1c6dd0", dashFrom:ha.hist.length-1 },
    { data:[...hb.hist, ...hb.forecast], color:"#0aa88f", dashFrom:hb.hist.length-1 },
  ], {height:230});
  const legend = `
    <div class="chart-legend">
      <span><i style="background:#1c6dd0"></i>${a.name}</span>
      <span><i style="background:#0aa88f"></i>${b.name}</span>
      <span class="chart-legend-note">Solid = last 14 days · Dashed = 3-day forecast</span>
    </div>`;
  return `<div class="chart-svg-wrap">${chart}</div>${legend}`;
}

function scoreToStatus(score){
  return score>=70 ? "good" : score>=45 ? "fair" : "poor";
}

function trendSummaryHTML(st){
  const {forecast, slope} = stationHistory(st);
  const dir = slope>=0.15 ? "rising" : slope<=-0.15 ? "falling" : "holding steady";
  const dirColor = slope>=0.15 ? "var(--good)" : slope<=-0.15 ? "var(--poor)" : "var(--ink-soft)";
  return `
    <div class="trend-summary">
      <div class="trend-summary-area">
        <span class="loc">${ICONS.pin.replace('width="20" height="20"','width="13" height="13"')} ${st.name}</span>
        <span class="trend-summary-now">Current score: <strong style="color:${STATUS_COLOR[st.status]}">${st.score}</strong> · ${STATUS_LABEL[st.status]}</span>
      </div>
      <div class="trend-summary-forecast">
        <span class="trend-summary-dir" style="color:${dirColor}">Trend ${dir}</span>
        ${forecast.map((v,i)=>`<span class="trend-chip">Day +${i+1}: <strong>${v}</strong></span>`).join("")}
      </div>
    </div>`;
}

/* ---------- Original inline-SVG illustrations for the Learn module (no external images) ---------- */
function learnArtSVG(key, compact){
  const h = compact ? 120 : 200;
  const bg = `<rect width="600" height="${h}" fill="var(--blue-bg)"/>`;
  if(key==="turbidity"){
    return `<svg viewBox="0 0 600 ${h}" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
      ${bg}
      <path d="M0,${h*0.35} C120,${h*0.25} 200,${h*0.45} 320,${h*0.35} C440,${h*0.25} 500,${h*0.45} 600,${h*0.35} L600,${h} L0,${h} Z" fill="#bcdff0"/>
      <path d="M0,${h*0.55} C140,${h*0.45} 220,${h*0.65} 340,${h*0.55} C460,${h*0.45} 520,${h*0.65} 600,${h*0.55} L600,${h} L0,${h} Z" fill="#0aa88f" fill-opacity=".55"/>
      ${[...Array(14)].map((_,i)=>`<circle cx="${40+ (i*41)%560}" cy="${h*0.42 + ((i*37)%40)}" r="${2+(i%3)}" fill="#123a6b" fill-opacity=".35"/>`).join("")}
      <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8">
        <line x1="90" y1="14" x2="60" y2="${h*0.4}"/><line x1="140" y1="14" x2="120" y2="${h*0.4}"/><line x1="190" y1="14" x2="180" y2="${h*0.4}"/>
      </g>
    </svg>`;
  }
  if(key==="microplastics"){
    return `<svg viewBox="0 0 600 ${h}" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
      ${bg}
      <path d="M0,${h*0.6} C100,${h*0.5} 220,${h*0.72} 320,${h*0.6} C420,${h*0.48} 520,${h*0.72} 600,${h*0.6} L600,${h} L0,${h} Z" fill="#8fd3d9"/>
      ${[[80,h*0.3,6],[150,h*0.22,4],[260,h*0.34,5],[350,h*0.2,4],[430,h*0.3,6],[500,h*0.22,4]].map(([x,y,s])=>`<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="#e6553a" fill-opacity=".8" transform="rotate(${(x*3)%40} ${x} ${y})"/>`).join("")}
      <circle cx="470" cy="${h*0.32}" r="34" fill="none" stroke="#0b2545" stroke-width="4"/>
      <line x1="493" y1="${h*0.32+23}" x2="518" y2="${h*0.32+46}" stroke="#0b2545" stroke-width="6" stroke-linecap="round"/>
    </svg>`;
  }
  if(key==="score"){
    const cx=300, cy=h*0.82, r=150;
    const arc = (a0,a1,color)=>{
      const p0=[cx+r*Math.cos(a0), cy+r*Math.sin(a0)], p1=[cx+r*Math.cos(a1), cy+r*Math.sin(a1)];
      return `<path d="M${p0[0].toFixed(1)},${p0[1].toFixed(1)} A${r},${r} 0 0 1 ${p1[0].toFixed(1)},${p1[1].toFixed(1)}" fill="none" stroke="${color}" stroke-width="22" stroke-linecap="round"/>`;
    };
    const PI = Math.PI;
    return `<svg viewBox="0 0 600 ${h}" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
      ${bg}
      ${arc(PI, PI+0.45*PI, "#e6553a")}
      ${arc(PI+0.45*PI, PI+0.75*PI, "#f2b134")}
      ${arc(PI+0.75*PI, 2*PI, "#12b886")}
      <line x1="${cx}" y1="${cy}" x2="${(cx+r*0.75*Math.cos(PI+0.62*PI)).toFixed(1)}" y2="${(cy+r*0.75*Math.sin(PI+0.62*PI)).toFixed(1)}" stroke="#0b2545" stroke-width="6" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="9" fill="#0b2545"/>
    </svg>`;
  }
  // report
  return `<svg viewBox="0 0 600 ${h}" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
    ${bg}
    <g stroke="var(--line)" stroke-width="1">
      ${[...Array(6)].map((_,i)=>`<line x1="${i*100}" y1="0" x2="${i*100}" y2="${h}"/>`).join("")}
      ${[...Array(4)].map((_,i)=>`<line x1="0" y1="${i*(h/3)}" x2="600" y2="${i*(h/3)}"/>`).join("")}
    </g>
    <path d="M300,${h*0.22} C330,${h*0.22} 352,${h*0.42} 352,${h*0.6} C352,${h*0.8} 300,${h*0.98} 300,${h*0.98} C300,${h*0.98} 248,${h*0.8} 248,${h*0.6} C248,${h*0.42} 270,${h*0.22} 300,${h*0.22} Z" fill="#e6553a"/>
    <circle cx="300" cy="${h*0.5}" r="16" fill="#fff"/>
    <rect x="390" y="${h*0.28}" width="86" height="60" rx="8" fill="#0b2545"/>
    <circle cx="433" cy="${h*0.28+30}" r="16" fill="#5be0c5"/>
  </svg>`;
}

function riskBg(r){ return r==='high' ? 'var(--high-bg)' : r==='med' ? 'var(--med-bg)' : 'var(--low-bg)'; }
function riskFg(r){ return r==='high' ? 'var(--high-fg)' : r==='med' ? 'var(--med-fg)' : 'var(--low-fg)'; }
function riskLabel(r){ return r==='high' ? 'High Risk' : r==='med' ? 'Moderate' : 'Good'; }

function attachScanEvents(){
  const dz = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  if(dz) dz.onclick = ()=> fileInput && fileInput.click();
  if(fileInput) fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      scanState = {img:ev.target.result, analyzing:false, progress:0, result:null, presetKey:null};
      render();
    };
    reader.readAsDataURL(file);
  };
  document.querySelectorAll(".sample-swatch").forEach(btn=>{
    btn.onclick = ()=>{
      const preset = SCAN_PRESETS.find(p=>p.key===btn.dataset.preset);
      scanState = {img:`data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='240'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>${preset.key==='clear'?"<stop offset='0' stop-color='%238fd3d9'/><stop offset='1' stop-color='%233aa8c1'/>":preset.key==='murky'?"<stop offset='0' stop-color='%23c9a15c'/><stop offset='1' stop-color='%238a6a3a'/>":"<stop offset='0' stop-color='%235a5a3c'/><stop offset='1' stop-color='%2322261b'/>"}</linearGradient></defs><rect width='400' height='240' fill='url(%23g)'/></svg>`)}`, analyzing:false, progress:0, result:null, presetKey:preset.key};
      render();
    };
  });
  const analyzeBtn = document.getElementById("analyzeBtn");
  if(analyzeBtn) analyzeBtn.onclick = ()=> runScanAnalysis();
  const scanReportBtn = document.getElementById("scanReportBtn");
  if(scanReportBtn) scanReportBtn.onclick = ()=> navigate("report");
}
const SCAN_STEPS = ["Analysing pixel colorimetry…","Estimating turbidity from light scatter…","Scanning for microplastic signatures…","Cross-referencing nearby station baselines…","Finalising report…"];
function runScanAnalysis(){
  scanState.analyzing = true;
  scanState.progress = 0;
  render();
  let step = 0;
  const timer = setInterval(()=>{
    step++;
    scanState.progress = Math.min(100, Math.round((step/SCAN_STEPS.length)*100));
    const label = document.getElementById("scanStepLabel");
    if(label) label.textContent = SCAN_STEPS[Math.min(step,SCAN_STEPS.length-1)];
    const fill = document.querySelector(".scan-bar-fill");
    if(fill) fill.style.width = scanState.progress+"%";
    const pct = document.querySelector(".scan-progress .row span:last-child");
    if(pct) pct.textContent = scanState.progress+"%";
    if(step>=SCAN_STEPS.length){
      clearInterval(timer);
      let preset = SCAN_PRESETS.find(p=>p.key===scanState.presetKey);
      if(!preset){
        // deterministic mock result from image data length
        const seedVal = (scanState.img||"").length % SCAN_PRESETS.length;
        preset = SCAN_PRESETS[seedVal];
      }
      scanState.analyzing = false;
      scanState.result = preset;
      render();
    }
  }, 420);
}

function renderCompare(){
  const a = MONITOR_POINTS.find(p=>p.code===compareCodes[0]);
  const b = MONITOR_POINTS.find(p=>p.code===compareCodes[1]);
  const cardFor = (p)=>`
    <div class="compare-card">
      <div class="code">${p.code}</div>
      <h3>${p.name}</h3>
      <div class="compare-metric-row"><span>Score</span><strong style="color:${STATUS_COLOR[p.status]}">${p.score}</strong></div>
      <div class="compare-metric-row"><span>Status</span><strong>${STATUS_LABEL[p.status]}</strong></div>
      <div class="compare-metric-row"><span>14-day trend</span><strong>${stationHistory(p).slope>=0?'↑ improving':'↓ declining'}</strong></div>
      <div class="compare-metric-row"><span>3-day forecast</span><strong>${stationHistory(p).forecast.join(" → ")}</strong></div>
    </div>`;
  return `
    <div class="page">
      <div class="title-row">${ICONS.trend}<h1>Compare Stations</h1></div>
      <div class="page-sub" style="margin-bottom:24px;">Put any two monitoring stations side by side.</div>
      <div class="compare-pickers">
        <select id="compareA">${MONITOR_POINTS.map(p=>`<option value="${p.code}" ${p.code===compareCodes[0]?'selected':''}>${p.name}</option>`).join("")}</select>
        <select id="compareB">${MONITOR_POINTS.map(p=>`<option value="${p.code}" ${p.code===compareCodes[1]?'selected':''}>${p.name}</option>`).join("")}</select>
      </div>
      <div class="compare-cards">${cardFor(a)}${cardFor(b)}</div>
      <div class="compare-canvas-wrap">${compareChartSVG(a,b)}</div>
      ${compareSummaryHTML(a,b)}
    </div>
  `;
}

function compareSummaryHTML(a,b){
  const ha = stationHistory(a), hb = stationHistory(b);
  const diff = Math.abs(a.score - b.score);
  const leader = a.score===b.score ? null : (a.score>b.score ? a : b);
  const leaderRow = leader
    ? `<strong style="color:${STATUS_COLOR[leader.status]}">${leader.name}</strong> is currently ahead by <strong>${diff}</strong> point${diff===1?'':'s'}.`
    : `Both stations are tied at <strong>${a.score}</strong>.`;
  const bothImproving = ha.slope>=0 && hb.slope>=0;
  const bothDeclining = ha.slope<0 && hb.slope<0;
  const trendNote = bothImproving ? "Both areas are trending upward over the last 6 days."
    : bothDeclining ? "Both areas are trending downward over the last 6 days — worth flagging for follow-up."
    : `${ha.slope>=hb.slope ? a.name : b.name} has the stronger recent trend.`;
  const closingGap = (Math.abs((a.score+ha.forecast[2])-( b.score+hb.forecast[2])) < diff);
  const gapNote = a.score===b.score ? "" : (closingGap ? "The gap between the two is projected to narrow over the next 3 days."
    : "The gap between the two is projected to widen over the next 3 days.");
  return `
    <div class="panel compare-summary">
      <div class="panel-head"><h2>Comparison Summary</h2></div>
      <div class="compare-summary-body">
        <div class="compare-summary-row"><span class="cs-label">Score gap</span><span class="cs-val">${leaderRow}</span></div>
        <div class="compare-summary-row"><span class="cs-label">Status</span><span class="cs-val">${a.name} is <strong style="color:${STATUS_COLOR[a.status]}">${STATUS_LABEL[a.status]}</strong>, ${b.name} is <strong style="color:${STATUS_COLOR[b.status]}">${STATUS_LABEL[b.status]}</strong>.</span></div>
        <div class="compare-summary-row"><span class="cs-label">6-day trend</span><span class="cs-val">${trendNote}</span></div>
        ${gapNote ? `<div class="compare-summary-row"><span class="cs-label">3-day outlook</span><span class="cs-val">${gapNote}</span></div>` : ``}
        <div class="compare-summary-row"><span class="cs-label">Forecast (+3d)</span><span class="cs-val">${a.name}: <strong>${ha.forecast[2]}</strong> &nbsp;·&nbsp; ${b.name}: <strong>${hb.forecast[2]}</strong></span></div>
      </div>
    </div>`;
}
function attachCompareEvents(){
  const selA = document.getElementById("compareA");
  const selB = document.getElementById("compareB");
  if(selA) selA.onchange = ()=>{ compareCodes[0]=selA.value; render(); };
  if(selB) selB.onchange = ()=>{ compareCodes[1]=selB.value; render(); };
}

let reportState = { submitted:false, data:{} };
let reportExtras = { severity:"Medium", photo:null, recording:false, desc:"" };

function attachReportEvents(){
  if(reportState.submitted){
    const again = document.getElementById("reportAgain");
    if(again) again.onclick = ()=>{ reportState = {submitted:false, data:{}}; reportExtras = {severity:"Medium", photo:null, recording:false, desc:""}; render(); };
    return;
  }
  const form = document.getElementById("reportForm");
  if(!form) return;
  const sevRow = document.getElementById("sevRow");
  sevRow.querySelectorAll(".sev-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      sevRow.querySelectorAll(".sev-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      reportExtras.severity = btn.dataset.sev;
    });
  });
  const descEl = document.getElementById("f-desc");
  if(descEl) descEl.addEventListener("input", ()=>{ reportExtras.desc = descEl.value; });

  const locBtn = document.getElementById("useLocationBtn");
  if(locBtn) locBtn.addEventListener("click", ()=>{
    if(!navigator.geolocation){ locBtn.textContent = "Location unavailable"; return; }
    locBtn.innerHTML = "Locating…";
    navigator.geolocation.getCurrentPosition((pos)=>{
      document.getElementById("f-lat").value = pos.coords.latitude.toFixed(4);
      document.getElementById("f-lng").value = pos.coords.longitude.toFixed(4);
      locBtn.innerHTML = `${ICONS.location} Location added`;
    }, ()=>{ locBtn.innerHTML = `${ICONS.location} Permission denied`; });
  });

  const voiceBtn = document.getElementById("voiceBtn");
  if(voiceBtn) voiceBtn.addEventListener("click", ()=>{
    reportExtras.recording = !reportExtras.recording;
    render();
  });

  const photoBtn = document.getElementById("photoBtn");
  const photoInput = document.getElementById("photoInput");
  if(photoBtn) photoBtn.addEventListener("click", ()=> photoInput && photoInput.click());
  if(photoInput) photoInput.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ reportExtras.photo = ev.target.result; render(); };
    reader.readAsDataURL(file);
  });

  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const name = document.getElementById("f-name").value.trim();
    const lat = document.getElementById("f-lat").value.trim();
    const lng = document.getElementById("f-lng").value.trim();
    if(!name || !lat || !lng) return;
    reportState = { submitted:true, data:{name, lat, lng} };
    render();
  });
}

============================================================ */
const BOT_CHIPS = ["What's a good score?", "Any alerts near me?", "How do I report pollution?", "What is turbidity?"];
function botReply(q){
  const s = q.toLowerCase();
  if(s.includes("score")) return "Scores run 0–100: 70+ is Good, 45–69 is Moderate, below 45 is High Risk. It blends pH, turbidity, TDS, temperature and dissolved oxygen.";
  if(s.includes("alert") || s.includes("near")) return `There are currently ${ALERTS.length} active alerts, ${ALERTS.filter(a=>a.level==='HIGH').length} of them HIGH severity. Check the Dashboard's Smart Alerts panel for details.`;
  if(s.includes("report")) return "Go to the Report page, drop a pin (or use 'Use my location'), pick a severity, add a photo if you can, and submit — it's anonymous.";
  if(s.includes("turbid")) return "Turbidity measures how cloudy water is from suspended particles — a fast early-warning signal for runoff or discharge. See Learn → 'What is turbidity, really?'.";
  if(s.includes("microplastic")) return "Our AI Scan and buoy sensors flag microplastic density using laser-scatter + image analysis. Try the AI Scan page on a sample photo!";
  if(s.includes("forecast") || s.includes("predict")) return "The Dashboard's Trend & Forecast panel projects each station's score 3 days out using its recent 6-day trend.";
  if(s.includes("hi") || s.includes("hello") || s.includes("hey")) return "Hey! I can help with scores, alerts, reporting, or reading the dashboard. What's up?";
  return "Good question — I don't have a canned answer for that yet, but the Learn page covers most water-quality basics in plain language.";
}
function renderBotPanel(){
  const panel = document.getElementById("botPanel");
  if(!botOpen){ panel.hidden = true; panel.innerHTML=""; return; }
  panel.hidden = false;
  panel.innerHTML = `
    <div class="bot-panel">
      <div class="bot-head">
        <div class="bot-head-name"><span class="bot-status"></span> AquaBot</div>
        <button class="bot-close" id="botCloseBtn">${ICONS.close}</button>
      </div>
      <div class="bot-msgs" id="botMsgs">
        ${botMessages.map(m=>`<div class="bot-msg ${m.who}">${m.text}</div>`).join("")}
      </div>
      <div class="bot-suggest">${BOT_CHIPS.map(c=>`<button class="bot-chip" data-chip="${c}">${c}</button>`).join("")}</div>
      <div class="bot-input-row">
        <input type="text" id="botInput" placeholder="Ask AquaBot..." />
        <button class="bot-send" id="botSendBtn">${ICONS.send}</button>
      </div>
    </div>`;
  const msgsEl = document.getElementById("botMsgs");
  if(msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
  document.getElementById("botCloseBtn").onclick = ()=>{ botOpen=false; renderBotPanel(); };
  document.querySelectorAll(".bot-chip").forEach(chip=>{
    chip.onclick = ()=> sendBotMessage(chip.dataset.chip);
  });
  document.getElementById("botSendBtn").onclick = ()=>{
    const inp = document.getElementById("botInput");
    if(inp.value.trim()) sendBotMessage(inp.value.trim());
  };
  document.getElementById("botInput").addEventListener("keydown",(e)=>{
    if(e.key==="Enter" && e.target.value.trim()) sendBotMessage(e.target.value.trim());
  });
}
function sendBotMessage(text){
  botMessages.push({who:"user", text});
  botMessages.push({who:"bot", text: botReply(text)});
  renderBotPanel();
}
document.getElementById("botFab").onclick = (e)=>{
  e.stopPropagation();
  botOpen = !botOpen;
  notifOpen = false;
  renderBotPanel();
  renderNotifPop();
};

render();

/* ============================================================
   LIVE DATA TICK — Average score, Zones needing attention,
   Active alerts and Smart Alerts update in real time.
   (Everything else on the page is untouched.)
============================================================ */
function flashEl(el){
  if(!el) return;
  el.classList.add("flash");
  setTimeout(()=>el.classList.remove("flash"), 700);
}

function tickLiveData(){
  // --- 1. drift each station's score slightly, real sensor-noise style ---
  MONITOR_POINTS.forEach(p=>{
    const delta = Math.round((Math.random()*6)-3); // -3..+3
    p.score = Math.max(4, Math.min(97, p.score + delta));
    p.status = scoreToStatus(p.score);
  });

  // --- 2. age existing alerts, occasionally resolve the oldest one ---
  ALERTS.forEach(a=>{ if(Math.random()<0.6) a.hours += 1; });
  if(ALERTS.length>3 && Math.random()<0.18){
    ALERTS.sort((a,b)=>b.hours-a.hours);
    ALERTS.shift();
  }
  // --- 3. occasionally roll in a fresh alert from the pool ---
  if(ALERTS.length<7 && Math.random()<0.22){
    const candidate = ALERT_POOL[Math.floor(Math.random()*ALERT_POOL.length)];
    if(!ALERTS.some(a=>a.title===candidate.title && a.code===candidate.code)){
      ALERTS.unshift({...candidate, hours:0});
    }
  }

  if(currentPage!=="dashboard") return;

  // --- update Average score / Zones needing attention / Active alerts ---
  const avg = Math.round(MONITOR_POINTS.reduce((s,p)=>s+p.score,0)/MONITOR_POINTS.length);
  const poor = MONITOR_POINTS.filter(p=>p.status==="poor").length;

  const avgEl = document.getElementById("avgScoreVal");
  if(avgEl){ avgEl.textContent = avg; flashEl(avgEl); }

  const poorEl = document.getElementById("zonesAttentionVal");
  if(poorEl){ poorEl.textContent = poor; flashEl(poorEl); }

  const alertsEl = document.getElementById("activeAlertsVal");
  if(alertsEl){ alertsEl.textContent = ALERTS.length; flashEl(alertsEl); }

  const alertsSub = document.getElementById("activeAlertsSub");
  if(alertsSub) alertsSub.textContent = "Updated just now";

  // --- update Smart Alerts panel ---
  const listEl = document.getElementById("smartAlertsList");
  if(listEl){
    listEl.innerHTML = ALERTS.map(a=>alertItemHTML(a)).join("");
    flashEl(listEl);
  }

  const freshEl = document.getElementById("freshTick");
  if(freshEl) freshEl.textContent = "Updated just now";
}

setInterval(tickLiveData, 6000);
